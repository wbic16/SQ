[package]
name = "sq"
version = "0.6.3"
authors = ["Will Bickford <wbic16@gmail.com>"]
description = "A minimal client-server for phext hosting"
homepage = "https://phext.io/"
license = "MIT"
edition = "2021"

[dependencies]
libphext = "0.6.4"
percent-encoding = "2.3.1"
libc = "0.2"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
